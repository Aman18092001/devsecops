apiVersion: v1
kind: ServiceAccount
metadata:
  name: devsecops-sa
  namespace: dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: devsecops-role
rules:
  - apiGroups: ["", "apps"]
    resources: ["pods", "deployments", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: devsecops-binding
subjects:
  - kind: ServiceAccount
    name: devsecops-sa
    namespace: dev
roleRef:
  kind: ClusterRole
  name: devsecops-role
  apiGroup: rbac.authorization.k8s.io
