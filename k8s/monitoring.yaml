apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: devsecops-app-monitor
  namespace: monitoring
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: devsecops-app
  namespaceSelector:
    matchNames:
      - dev
      - prod
  endpoints:
  - port: http
    path: /metrics
    interval: 15s
